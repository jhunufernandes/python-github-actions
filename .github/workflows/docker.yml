name: docker-publish
on:
  workflow_call:
    inputs:
      image_name:
        required: false
        type: string
        description: Image name without registry (defaults to the lowercased repository name)
      platforms:
        required: false
        type: string
        default: linux/amd64,linux/arm64

permissions:
  contents: read
  packages: write

jobs:
  publish-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # GHCR requires a lowercase image name; GITHUB_REPOSITORY may not be
      - name: Compute image tags
        env:
          IMAGE_NAME: ${{ inputs.image_name }}
          DEFAULT_REPOSITORY: ${{ github.repository }}
        run: |
          IMAGE="ghcr.io/${IMAGE_NAME:-$DEFAULT_REPOSITORY}"
          echo "IMAGE=${IMAGE,,}" >> "$GITHUB_ENV"
          echo "SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ inputs.platforms }}
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ env.SHA }}
