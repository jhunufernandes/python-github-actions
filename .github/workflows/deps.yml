name: deps
on:
  workflow_call:
    inputs:
      extras:
        required: true
        type: string
      python_version:
        required: false
        type: string
        default: "3.11"
jobs:
  build-venv:
    if: inputs.extras
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python_version }}
      - run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install ".[${{ inputs.extras }}]"
      - run: |
          zip -r venv.zip .venv
      - uses: actions/upload-artifact@v4
        with:
          name: venv-${{ inputs.extras }}
          path: venv.zip
