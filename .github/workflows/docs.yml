name: docs-deploy
on:
  workflow_call:
    inputs:
      extras:
        required: true
        type: string
jobs:
  deploy-pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: venv-${{ inputs.extras }}
          path: .
      - run: |
          unzip venv.zip
      - run: |
          .venv/bin/python -m mkdocs gh-deploy -f docs/mkdocs.yml --force
