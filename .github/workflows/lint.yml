name: lint
on:
  workflow_call:
    inputs:
      python_version:
        required: false
        type: string
        default: "3.11"
      install_args:
        required: false
        type: string
        default: "-e . --group dev"
        description: Arguments passed to pip install (extras like ".[dev]" or PEP 735 groups like "-e . --group dev")

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python_version }}
      - run: python -m pip install --upgrade pip
      - run: pip install ${{ inputs.install_args }}
      - run: ruff check .
      - run: ty check .
