name: release-py
on:
  workflow_call:
    outputs:
      release_version:
        description: Release version read from pyproject.toml
        value: ${{ jobs.get-release-version.outputs.release_version }}
jobs:
  get-release-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: version
        run: |
          release_version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "release_version=$release_version" >> "$GITHUB_OUTPUT"
    outputs:
      release_version: ${{ steps.version.outputs.release_version }}
