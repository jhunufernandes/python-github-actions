name: release
on:
  workflow_call:
jobs:
  get-release-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: |
          release_version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "release_version=$release_version" >> "$GITHUB_OUTPUT"
    outputs:
      release_version: ${{ steps.version.outputs.release_version }}
  create-tag:
    if: github.event.head_commit.message != 'Automated tag'
    needs:
      - get-release-version
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          git config --global user.name github-actions[bot]
          git config --global user.email 41898282+github-actions[bot]@users.noreply.github.com
          # plain `git push` never sends tags — push the ref explicitly
          git tag --force "v${{ needs.get-release-version.outputs.release_version }}"
          git push origin "v${{ needs.get-release-version.outputs.release_version }}" --force
        id: tag-id
  create-release:
    needs:
      - get-release-version
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ needs.get-release-version.outputs.release_version }}
          name: Release ${{ needs.get-release-version.outputs.release_version }}
          body: ${{ github.event.head_commit.message }}
          draft: false
          prerelease: false
