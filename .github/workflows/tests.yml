name: tests
on:
  workflow_call:
    inputs:
      extras:
        required: true
        type: string
jobs:
  run-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: venv-${{ inputs.extras }}
          path: .
      - run: |
          unzip venv.zip
      - name: Run tests
        run: |
          code=0
          .venv/bin/python -m unittest discover -v || code=$?
          if [ "$code" -eq 5 ]; then
            echo "::warning::No tests found, skipping."
            exit 0
          fi
          exit $code
