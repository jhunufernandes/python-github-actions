name: issue-to-pr
on:
  workflow_call:
    inputs:
      pr_base:
        required: true
        type: string

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  create-issue-branch:
    outputs:
      branch: ${{ steps.branch.outputs.branch }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          SLUG=$(echo "$ISSUE_TITLE" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+//; s/-+$//')
          BRANCH="issue/${ISSUE_NUMBER}-${SLUG}"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          git config --global user.name github-actions[bot]
          git config --global user.email 41898282+github-actions[bot]@users.noreply.github.com
          git checkout -b "$BRANCH"
          git push -u origin "$BRANCH"
  assign-issue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            try {
              await github.rest.issues.addAssignees({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                assignees: [context.repo.owner]
              });
              console.log(`Issue #${context.issue.number} assigned to ${context.repo.owner}`);
            } catch (error) {
              console.error(`Failed to assign issue: ${error.message}`);
            }
  create-draft-pr:
    needs: create-issue-branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v9
        env:
          BRANCH: ${{ needs.create-issue-branch.outputs.branch }}
          PR_BASE: ${{ inputs.pr_base }}
        with:
          script: |
            try {
              await github.rest.pulls.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `Draft PR for issue #${context.issue.number}`,
                head: process.env.BRANCH,
                base: process.env.PR_BASE,
                draft: true
              });
              console.log(`Draft PR created for issue #${context.issue.number}`);
            } catch (error) {
              console.error(`Failed to create draft PR: ${error.message}`);
            }
